name: Scan skills

on:
  workflow_dispatch:
    inputs:
      skill-count:
        description: "Number of skills to scan (0 = all)"
        required: true
        default: "10"
        type: number
      fail-mode:
        description: "Behavior when dangerous skills are found"
        required: true
        default: "continue"
        type: choice
        options:
          - continue
          - stop
      use-llm:
        description: "Make use of LLM for analysis"
        required: true
        default: "yes"
        type: choice
        options:
          - no
          - yes

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Select skills to scan
        run: |
          count="${{ github.event.inputs.skill-count }}"
          rm -rf .scan
          mkdir -p .scan
          if [ -z "$count" ] || [ "$count" = "0" ]; then
            cp -r skills/* .scan/
          else
            ls -d skills/*/ | head -n "$count" | xargs -r cp -r -t .scan/
          fi
          echo "Selected $(find .scan -mindepth 1 -maxdepth 1 -type d | wc -l) skills"

      - name: Install scanner engines
        run: |
          pipx install git+https://github.com/NVIDIA/skillspector.git
          pipx install git+https://github.com/cisco-ai-defense/skill-scanner.git

      - name: Run SkillGuard scan
        continue-on-error: ${{ github.event.inputs.fail-mode == 'continue' }}
        uses: AI-Provenance/skillguard-core@main
        with:
          path: .scan/
          fail-on: dangerous
          workers: "8"
          use-llm: ${{ github.event.inputs.use-llm == 'yes' }}
        env:
          SKILLGUARD_LLM_API_KEY: ${{ secrets.SKILLGUARD_LLM_API_KEY }}
          SKILLGUARD_LLM_BASE_URL: ${{ vars.SKILLGUARD_LLM_BASE_URL }}
          
      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: skillguard.sarif
